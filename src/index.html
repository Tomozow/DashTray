<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>DashTray</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="toggle" title="サイドバーを開閉">☰</button>
  <div id="tabs"></div>
  <span id="status"></span>
  <button id="gear" title="設定">⚙</button>
</header>
<dialog id="settings">
  <h2>設定</h2>
  <!-- 各行は「左に項目名と説明、右に操作部品」 -->
  <h3>起動</h3>
  <label class="opt"><span>Windows 起動時に起動</span><input type="checkbox" id="autostart"></label>
  <label class="opt sub"><span>最小化して起動<small>タスクトレイに常駐します</small></span><input type="checkbox" id="startMinimized"></label>
  <label class="opt"><span>常に前面に表示</span><input type="checkbox" id="alwaysOnTop"></label>
  <h3>一覧とプレビュー</h3>
  <label class="opt"><span>新着のまとめ方</span><select id="groupBy"><option value="server">サーバーごと</option><option value="channel">チャンネルごと</option></select></label>
  <label class="opt"><span>スレッドの発言を親チャンネルにまとめる</span><input type="checkbox" id="mergeThreads"></label>
  <label class="opt"><span>本文プレビューを表示</span><input type="checkbox" id="showPreview"></label>
  <label class="opt sub"><span>プレビューに残す履歴<small>0 で選んだ 1 件だけ。自分の発言も含みます</small></span><span><input type="number" id="history" min="0" max="10" step="1"> 件</span></label>
  <h3>受信トレイ</h3>
  <label class="opt"><span>使い方<small>受信トレイに入らない方は ★ を付けたものだけ受け取ります</small></span><select id="inboxMode">
    <option value="off">使わない</option>
    <option value="mix">サーバーと DM をまとめる</option>
    <option value="split">サーバーと DM を分ける</option>
    <option value="server">サーバーのみ</option>
    <option value="dm">DM のみ</option>
  </select></label>
  <h3>通知</h3>
  <table>
    <thead><tr><th>トレイ</th><th id="toastHead">トースト</th><th>通知音</th><th id="badgeHead">未読バッジ</th></tr></thead>
    <tbody id="notifyRows"></tbody>
  </table>
  <label class="opt" id="mixDmOnlyRow"><span>まとめた受信トレイでは DM だけ通知<small>サーバーの発言は一覧に出るだけになります</small></span><input type="checkbox" id="mixDmOnly"></label>
  <label class="opt"><span>タスクトレイのアイコンにも未読を出す<small>赤い点で知らせます</small></span><input type="checkbox" id="trayBadge"></label>
  <label class="opt"><span>同じチャンネルの通知音を鳴らさない間隔<small>0 で毎回鳴らします</small></span><span><input type="number" id="soundCooldown" min="0" step="1"> 秒</span></label>
  <h3>Discord 連携</h3>
  <div class="opt"><span>Client ID<small>テスター登録をしていない人は、自分で作った Discord アプリの ID を入れます（導入手順を参照）。変えると Discord で許可し直します</small></span><span><input id="clientId" placeholder="空欄なら共有の ID" inputmode="numeric"> <button id="applyClientId" class="ghost">適用</button></span></div>
  <div class="foot">
    <button id="testNotify" class="ghost">通知をテスト</button>
    <button id="closeSettings">閉じる</button>
  </div>
</dialog>
<nav>
  <div class="tools">
    <input id="q" type="search" placeholder="検索">
    <select id="sort" title="並べ替え">
      <option value="recent">更新順</option>
      <option value="name">名前順</option>
      <option disabled>──────────</option>
      <option value="fav">★のみ表示</option>
    </select>
  </div>
  <div id="nav"></div>
</nav>
<main>
  <div id="list"></div>
  <div id="split" title="ドラッグで比率を変更"></div>
  <div id="preview"></div>
</main>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
