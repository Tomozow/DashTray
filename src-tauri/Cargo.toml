[package]
name = "discordmailer"
version = "1.0.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-winrt-notification = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
sha2 = "0.10"
base64 = "0.22"

[features]
# ポータブル版: トーストなし、データは exe と同じフォルダー
portable = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# 普段のビルド用（npm run build:fast）。配布用の release より exe が約 1MB 大きいが、再ビルドは約 2 分 → 約 15 秒
[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
